<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #F4F6FA;
    --card: #FFFFFF;
    --ink: #0F172A;
    --ink2: #334155;
    --muted: #64748B;
    --line: #E2E8F0;
    --blue: #2563EB;
    --blue-soft: #EFF6FF;
    --red: #EF4444;
    --red-soft: #FEF2F2;
    --amber: #F59E0B;
    --amber-soft: #FFFBEB;
    --green: #10B981;
    --green-soft: #ECFDF5;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding-bottom: 96px; -webkit-font-smoothing: antialiased;
  }

  /* Top Hero Header */
  .hero {
    background: linear-gradient(145deg, #0B1120 0%, #172554 100%);
    color: #fff; padding: 18px 16px 20px; border-radius: 0 0 24px 24px;
    box-shadow: 0 8px 28px rgba(11, 17, 32, 0.22);
  }
  .hero-top { display: flex; justify-content: space-between; align-items: center; max-width: 640px; margin: 0 auto; }
  .brand-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-dot {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(135deg, #3B82F6, #FACC15);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 16px; color: #0B1120;
  }
  .brand-txt { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; }
  .brand-sub { font-size: 11px; color: #94A3B8; font-weight: 500; margin-top: 1px; }
  .icon-pill {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16);
    color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; backdrop-filter: blur(8px);
  }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    max-width: 640px; margin: 16px auto 0;
  }
  .kpi {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 10px 6px; text-align: center; cursor: pointer;
    transition: transform .12s ease, background .15s ease;
  }
  .kpi:active { transform: scale(0.97); }
  .kpi .v { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .kpi.warn .v { color: #FACC15; }
  .kpi.money .v { color: #34D399; font-size: 14px; line-height: 22px; }
  .kpi .k { font-size: 11px; color: #CBD5E1; margin-top: 2px; font-weight: 600; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }

  /* 36-Month Expiry Alert Banner */
  .alert-box {
    display: none; margin-top: 14px; background: #FFF1F2;
    border: 1px solid #FECDD3; border-radius: 18px; padding: 14px;
    box-shadow: 0 4px 14px rgba(225, 29, 72, 0.08);
  }
  .alert-box.show { display: block; }
  .alert-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .alert-hdr b { font-size: 13.5px; color: #BE123C; }
  .alert-row {
    background: #fff; border-radius: 12px; padding: 10px 12px; margin-top: 7px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border: 1px solid #FFE4E6;
  }
  .alert-info { font-size: 12.5px; line-height: 1.4; }
  .alert-info strong { font-size: 13.5px; color: var(--ink); }
  .alert-info span { color: #E11D48; font-weight: 700; font-size: 11.5px; }
  .alert-btns { display: flex; gap: 5px; flex-shrink: 0; }
  .mini-a {
    text-decoration: none; padding: 6px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 700; color: #fff;
  }
  .mini-a.me { background: #0F172A; }
  .mini-a.cu { background: #E11D48; }

  /* Search & Filter */
  .search-box { position: relative; margin-top: 14px; }
  .search-box input {
    width: 100%; padding: 13px 14px 13px 40px; border: 1px solid transparent;
    border-radius: 14px; background: #fff; font-size: 14.5px; box-shadow: var(--shadow); outline: none;
  }
  .search-box input:focus { border-color: var(--blue); }
  .search-box .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .55; }

  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 12px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .15s ease;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 3px 10px rgba(15,23,42,.15); }

  .bar-meta {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 2px 10px; font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .bar-meta select {
    border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px;
    font-size: 12px; font-weight: 600; background: #fff; color: var(--ink); outline: none;
  }

  /* Customer Cards */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card); border-radius: 18px; padding: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(226, 232, 240, 0.8);
    transition: transform .12s ease;
  }
  .c-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .c-title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .c-name { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }

  .pill { font-size: 11px; font-weight: 800; padding: 3.5px 8.5px; border-radius: 8px; }
  .tel-SK브로드밴드 { background: #EEF2FF; color: #4338CA; }
  .tel-KT { background: #FEF2F2; color: #DC2626; }
  .tel-LG\ U\+ { background: #FDF2F8; color: #DB2777; }
  .tel-스카이라이프 { background: #F0F9FF; color: #0284C7; }
  .tel-LG헬로비전 { background: #ECFDF5; color: #059669; }

  .st-상담중 { background: var(--amber-soft); color: #B45309; }
  .st-접수완료 { background: var(--blue-soft); color: var(--blue); }
  .st-개통완료 { background: var(--green-soft); color: #047857; }
  .st-보류취소 { background: #F1F5F9; color: #64748B; }

  .dday-chip { font-size: 11.5px; font-weight: 800; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .dday-red { background: #FEE2E2; color: #DC2626; }
  .dday-amber { background: #FEF3C7; color: #B45309; }
  .dday-gray { background: #F1F5F9; color: #475569; }

  .c-sub {
    margin-top: 8px; display: flex; justify-content: space-between; align-items: center;
    font-size: 13.5px; color: var(--ink2);
  }
  .phone-copy { font-weight: 700; color: var(--ink); cursor: pointer; }
  .prod-txt { font-size: 12.5px; color: var(--muted); font-weight: 600; }

  /* 36-Month Progress Bar */

<script>
const KEY = 'tonghap_internet_crm_v1';
let filter = '전체';
let tempPhotos = [];

function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const today = new Date();
  const plusDays = (d) => new Date(today.getTime() + d*86400000).toISOString().slice(0,10);
  const samples = [
    {
      id: 'sample_1', name: '김민수 (샘플)', phone: '010-1234-5678',
      carrier: 'KT', product: '인터넷+TV', openDate: '2023-12-20',
      expDate: plusDays(28), status: '개통완료', gift: 60, fee: 280000,
      settled: false, photos: [],
      memo: '샘플 데이터입니다. 수정하거나 삭제해서 쓰세요!\n3년 약정 만료 28일 전 (타사 이동 안내 예정)',
      createdAt: Date.now() - 100000
    },
    {
      id: 'sample_2', name: '이영희 (샘플)', phone: '010-9876-5432',
      carrier: 'SK브로드밴드', product: '인터넷+TV+휴대폰결합', openDate: '',
      expDate: plusDays(120), status: '상담중', gift: 60, fee: 300000,
      settled: false, photos: [],
      memo: '휴대폰 2회선 결합 희망 · 내일 오후 재연락 예정',
      createdAt: Date.now()
    }
  ];
  localStorage.setItem(KEY, JSON.stringify(samples));
  return samples;
}

function saveData(arr) {
  try {
    localStorage.setItem(KEY, JSON.stringify(arr));
    return true;
  } catch(e) {
    alert('저장 공간이 부족합니다. 백업 저장 후 오래된 사진을 정리해 주세요.');
    return false;
  }
}

function dday(expDate) {
  if (!expDate) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const tgt = new Date(expDate + 'T00:00:00');
  return Math.round((tgt - now) / 86400000);
}

function fmtMoney(n) { return n ? Number(n).toLocaleString('ko-KR') + '원' : '0원'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.style.display = 'none', 2200);
}

function quickFilter(f) {
  const btn = document.querySelector(`.chip[data-f="${f}"]`);
  if (btn) setFilter(f, btn);
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function copyPhone(p) {
  if (navigator.clipboard) navigator.clipboard.writeText(p).then(() => showToast('전화번호 복사됨: ' + p));
}

function fmtPhoneInput(el) {
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 3) el.value = d;
  else if (d.length <= 7) el.value = d.slice(0,3) + '-' + d.slice(3);
  else el.value = d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  syncModalCall();
}

function syncModalCall() {
  const d = document.getElementById('fPhone').value.replace(/\D/g, '');
  const btn = document.getElementById('modalCallBtn');
  if (d.length >= 8) {
    btn.href = 'tel:' + d;
    btn.style.display = 'inline-block';
  } else {
    btn.style.display = 'none';
  }
}

function pickChip(inputId, groupId, btn) {
  document.getElementById(inputId).value = btn.textContent.trim();
  document.querySelectorAll('#' + groupId + ' .seg-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function syncChips(inputId, groupId, val) {
  document.getElementById(inputId).value = val;
  document.querySelectorAll('#' + groupId + ' .seg-btn').forEach(b => {
    b.classList.toggle('on', b.textContent.trim() === val);
  });
}

function setTodayOpen() {
  document.getElementById('fOpenDate').value = new Date().toISOString().slice(0,10);
  autoExpiry();
}

function cycleStatus(id) {
  const order = ['상담중', '접수완료', '개통완료', '보류취소'];
  const data = loadData();
  const idx = data.findIndex(x => x.id === id);
  if (idx < 0) return;
  const cur = order.indexOf(data[idx].status);
  data[idx].status = order[(cur + 1) % order.length];
  saveData(data);
  render();
  showToast('상태 변경: ' + (data[idx].status === '보류취소' ? '보류/취소' : data[idx].status));
}

function toggleSettle(id) {
  const data = loadData();
  const idx = data.findIndex(x => x.id === id);
  if (idx < 0) return;
  data[idx].settled = !data[idx].settled;
  saveData(data);
  render();
  showToast(data[idx].settled ? '정산 완료로 변경됨' : '미정산으로 변경됨');
}

function render() {
  const data = loadData();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const sortBy = document.getElementById('sortBy').value;

  document.getElementById('stTotal').textContent = data.length;
  document.getElementById('stActive').textContent = data.filter(x => x.status === '상담중' || x.status === '접수완료').length;
  document.getElementById('stExpiring').textContent = data.filter(x => { const d = dday(x.expDate); return d !== null && d <= 90 && x.status !== '보류취소'; }).length;
  const unSettled = data.filter(x => !x.settled && x.status !== '보류취소').reduce((s, x) => s + (Number(x.fee)||0), 0);
  document.getElementById('stFee').textContent = fmtMoney(unSettled);

  // 36-Month Expiry Alert Banner
  const expired = data.filter(x => {
    if (x.status === '보류취소') return false;
    const d = dday(x.expDate);
    return d !== null && d <= 0;
  });
  const banner = document.getElementById('alertBanner');
  if (expired.length) {
    banner.classList.add('show');
    banner.innerHTML = `<div class="alert-hdr"><b>🔔 36개월 약정 만료 도래 고객 (${expired.length}명)</b></div>` +
      expired.map(x => {
        const d = dday(x.expDate);
        const over = d === 0 ? '오늘 만료!' : `만료 +${Math.abs(d)}일 지남`;
        const smsCust = encodeURIComponent(`안녕하세요, 통합 INTERNET입니다. ${x.name}님 이용 중이신 ${x.carrier} 인터넷·TV 3년 약정이 만료되어 더 유리한 혜택 안내드리고자 연락드렸습니다.`);
        return `<div class="alert-row">
          <div class="alert-info"><strong>${esc(x.name)}</strong> · ${esc(x.phone)}<br><span>${esc(x.carrier)} · ${over}</span></div>
          <div class="alert-btns">
            <a class="mini-a me" href="tel:${(x.phone||'').replace(/[^0-9+]/g,'')}">📞 전화</a>
            <a class="mini-a cu" href="sms:${(x.phone||'').replace(/[^0-9+]/g,'')}?body=${smsCust}">고객문자</a>
          </div>
        </div>`;
      }).join('');
  } else {
    banner.classList.remove('show');
    banner.innerHTML = '';
  }

  let rows = data.filter(x => {
    const d = dday(x.expDate);
    if (filter === '상담·접수' && !(x.status === '상담중' || x.status === '접수완료')) return false;
    if (filter === '만료임박' && !(d !== null && d <= 90 && x.status !== '보류취소')) return false;
    if (filter === '개통완료' && x.status !== '개통완료') return false;
    if (filter === '미정산' && (x.settled || x.status === '보류취소')) return false;
    if (q) {
      const hay = `${x.name} ${x.phone} ${x.carrier} ${x.product} ${x.memo}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    if (sortBy === 'expiry') {
      const da = dday(a.expDate); const db = dday(b.expDate);
      return (da === null ? 99999 : da) - (db === null ? 99999 : db);
    }
    if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '', 'ko');
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  document.getElementById('countLabel').textContent = `${rows.length}명 표시 중`;
  const list = document.getElementById('list');
  if (!rows.length) {
    list.innerHTML = `<div class="empty">조건에 맞는 고객이 없습니다.<br>오른쪽 아래 <b>+ 고객 등록</b>을 눌러 시작해 보세요.</div>`;
    return;
  }

  list.innerHTML = rows.map(x => {
    const d = dday(x.expDate);
    let dChip = '';
    let progHtml = '';
    if (d !== null) {
      if (d <= 0) dChip = `<span class="dday-chip dday-red">${d === 0 ? '오늘 만료' : '만료 +' + Math.abs(d) + '일'}</span>`;
      else if (d <= 90) dChip = `<span class="dday-chip dday-amber">D-${d} 임박</span>`;
      else dChip = `<span class="dday-chip dday-gray">D-${d}</span>`;

      const pct = Math.max(5, Math.min(100, Math.round(((1095 - d) / 1095) * 100)));
      const pColor = d <= 0 ? '#EF4444' : (d <= 90 ? '#F59E0B' : '#10B981');
      progHtml = `
        <div class="prog-wrap">
          <div class="prog-labels">
            <span>개통 ${x.openDate || '미입력'}</span>
            <span>만료 ${x.expDate}</span>
          </div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${pColor}"></div></div>
        </div>
      `;
    }
    const stLabel = x.status === '보류취소' ? '보류/취소' : x.status;
    const cleanPhone = (x.phone || '').replace(/[^0-9+]/g, '');
    const photosHtml = (x.photos && x.photos.length)
      ? `<div class="photo-strip">${x.photos.map(p => `<img src="${p}" onclick="openLightbox(this.src)" alt="첨부사진">`).join('')}</div>`
      : '';

    return `
      <div class="card">
        <div class="c-top">
          <div class="c-title">
            <span class="c-name">${esc(x.name)}</span>
            <span class="pill tel-${esc(x.carrier)}">${esc(x.carrier)}</span>
            <span class="pill st-${esc(x.status)}" style="cursor:pointer" title="터치해서 상태 변경" onclick="cycleStatus('${x.id}')">${esc(stLabel)} ↻</span>
          </div>
          ${dChip}
        </div>
        <div class="c-sub">
          <a class="phone-copy" href="tel:${cleanPhone}" style="text-decoration:none">📞 ${esc(x.phone)}</a>
          <span class="prod-txt">${esc(x.product)}${x.gift ? ` · 지원 ${x.gift}만` : ''}</span>
        </div>
        ${progHtml}
        ${x.fee ? `
          <div class="fee-row">
            <span class="fee-val">수수료 ${fmtMoney(x.fee)}</span>
            <button class="settle-btn ${x.settled ? 'settle-yes' : 'settle-no'}" onclick="toggleSettle('${x.id}')">
              ${x.settled ? '✅ 정산완료' : '⏳ 미정산 (터치해 완료)'}
            </button>
          </div>
        ` : ''}
        ${x.memo ? `<div class="memo">${esc(x.memo)}</div>` : ''}
        ${photosHtml}
        <div class="actions">
          <a class="act call" href="tel:${cleanPhone}">📞 전화</a>
          <a class="act sms" href="sms:${cleanPhone}">💬 문자</a>
          ${x.expDate ? `<button class="act" onclick="downloadICS('${x.id}')">📅 알림</button>` : `<button class="act" disabled style="opacity:.4">📅 알림</button>`}
          <button class="act" onclick="openModal('${x.id}')">✏️ 수정</button>
        </div>
      </div>
    `;
  }).join('');
}

function autoExpiry() {
  const od = document.getElementById('fOpenDate').value;
  if (!od) return;
  const dt = new Date(od + 'T00:00:00');
  dt.setFullYear(dt.getFullYear() + 3);
  document.getElementById('fExpDate').value = dt.toISOString().slice(0,10);
}

function renderPreviewPhotos() {
  const g = document.getElementById('pvGrid');
  g.innerHTML = tempPhotos.map((src, i) => `
    <div class="pv-item">
      <img src="${src}" onclick="openLightbox(this.src)">
      <button type="button" class="pv-del" onclick="removePhoto(${i})">✕</button>
    </div>
  `).join('');
}

function removePhoto(idx) { tempPhotos.splice(idx, 1); renderPreviewPhotos(); }

function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1000;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotos(e) {
  const files = Array.from(e.target.files || []);
  for (const f of files) tempPhotos.push(await compressImage(f));
  e.target.value = '';
  renderPreviewPhotos();
  if (files.length) showToast(`사진 ${files.length}장 추가됨`);
}

function openLightbox(src) { document.getElementById('lbImg').src = src; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
function openDataModal() { document.getElementById('dataBg').classList.add('open'); }
function closeDataModal() { document.getElementById('dataBg').classList.remove('open'); }

function openModal(id) {
  const bg = document.getElementById('modalBg');
  const delBtn = document.getElementById('modalDelBtn');
  if (id) {
    const item = loadData().find(x => x.id === id);
    if (!item) return;
    document.getElementById('modalTitle').textContent = '고객 정보 수정';
    document.getElementById('editId').value = item.id;
    document.getElementById('fName').value = item.name || '';
    document.getElementById('fPhone').value = item.phone || '';
    syncChips('fCarrier', 'carrierChips', item.carrier || 'SK브로드밴드');
    syncChips('fProduct', 'productChips', item.product || '인터넷+TV');
    document.getElementById('fOpenDate').value = item.openDate || '';
    document.getElementById('fExpDate').value = item.expDate || '';
    document.getElementById('fStatus').value = item.status || '상담중';
    document.getElementById('fGift').value = item.gift || '';
    document.getElementById('fFee').value = item.fee || '';
    document.getElementById('fSettled').checked = !!item.settled;
    document.getElementById('fMemo').value = item.memo || '';
    tempPhotos = Array.isArray(item.photos) ? [...item.photos] : [];
    delBtn.style.display = 'block';
  } else {
    document.getElementById('modalTitle').textContent = '새 고객 등록';
    document.getElementById('editId').value = '';
    ['fName','fPhone','fOpenDate','fExpDate','fGift','fFee','fMemo'].forEach(k => document.getElementById(k).value = '');
    syncChips('fCarrier', 'carrierChips', 'SK브로드밴드');
    syncChips('fProduct', 'productChips', '인터넷+TV');
    document.getElementById('fStatus').value = '상담중';
    document.getElementById('fSettled').checked = false;
    tempPhotos = [];
    delBtn.style.display = 'none';
  }
  renderPreviewPhotos();
  syncModalCall();
  bg.classList.add('open');
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function saveCustomer() {
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  if (!name || !phone) { alert('고객명과 연락처를 입력해 주세요.'); return; }
  const data = loadData();
  const id = document.getElementById('editId').value || ('c_' + Date.now());
  const rec = {
    id, name, phone,
    carrier: document.getElementById('fCarrier').value,
    product: document.getElementById('fProduct').value,
    openDate: document.getElementById('fOpenDate').value,
    expDate: document.getElementById('fExpDate').value,
    status: document.getElementById('fStatus').value,
    gift: Number(document.getElementById('fGift').value) || 0,
    fee: Number(document.getElementById('fFee').value) || 0,
    settled: document.getElementById('fSettled').checked,
    photos: tempPhotos,
    memo: document.getElementById('fMemo').value.trim(),
    createdAt: Date.now()
  };
  const idx = data.findIndex(x => x.id === id);
  if (idx >= 0) { rec.createdAt = data[idx].createdAt; data[idx] = rec; }
  else data.unshift(rec);
  if (!saveData(data)) return;
  closeModal();
  render();
  showToast('저장되었습니다!');
}

function delFromModal() {
  const id = document.getElementById('editId').value;
  if (!id || !confirm('이 고객 정보를 삭제할까요?')) return;
  saveData(loadData().filter(x => x.id !== id));
  closeModal();
  render();
  showToast('삭제되었습니다.');
}

function clearSamples() {
  const data = loadData().filter(x => !String(x.id).startsWith('sample_'));
  saveData(data);
  closeDataModal();
  render();
  showToast('샘플 데이터가 정리되었습니다.');
}

function downloadICS(id) {
  const x = loadData().find(item => item.id === id);
  if (!x || !x.expDate) return;
  const dt = x.expDate.replace(/-/g, '');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//TonghapInternet//CRM//KO',
    'BEGIN:VEVENT', `UID:${x.id}@tonghapinternet`,
    `DTSTART:${dt}T090000`, `DTEND:${dt}T093000`,
    `SUMMARY:[약정만료] ${x.name} (${x.carrier}) 36개월 도래`,
    `DESCRIPTION:고객명: ${x.name}\\n연락처: ${x.phone}\\n통신사: ${x.carrier} (${x.product})\\n개통일: ${x.openDate||'-'}`,
    'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY',
    `DESCRIPTION:${x.name}님 36개월 약정 만료!`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${x.name}_약정만료알림_${x.expDate}.ics`;
  a.click();
  showToast('캘린더 알림 파일 저장됨!');
}

function exportCSV() {
  const data = loadData();
  const hdr = ['고객명','연락처','통신사','상품','개통일','약정만료일','상태','현금지원(만원)','수수료(원)','정산여부','사진수','메모'];
  const lines = [hdr.join(',')].concat(data.map(x => [
    x.name, x.phone, x.carrier, x.product, x.openDate, x.expDate,
    x.status, x.gift, x.fee, x.settled ? '완료' : '미정산', (x.photos||[]).length, (x.memo||'').replace(/\n/g,' ')
  ].map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `통합INTERNET_고객관리_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function exportJSON() {
  const blob = new Blob([localStorage.getItem(KEY) || '[]'], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `통합INTERNET_고객백업_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('백업 파일 저장 완료!');
}

function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const arr = JSON.parse(r.result);
      if (!Array.isArray(arr)) throw new Error();
      if (saveData(arr)) { closeDataModal(); render(); showToast(`${arr.length}명 복원 완료!`); }
    } catch { alert('올바른 백업 파일이 아닙니다.'); }
  };
  r.readAsText(f);
}

render();
</script>
